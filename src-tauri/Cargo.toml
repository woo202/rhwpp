[package]
name = "rhwpp"
version = "0.1.0"
description = "rhwp 기반 Windows용 HWP/HWPX 워드프로세서"
authors = ["rhwpp contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "rhwpp_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
