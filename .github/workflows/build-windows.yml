name: Windows 빌드

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 설치 파일
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (앱 셸)
        uses: dtolnay/rust-toolchain@stable

      - name: wasm-pack 0.15.0
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: npm 의존성
        run: npm ci

      - name: 업스트림 rhwp 받기 (upstream.json 고정 커밋, sparse checkout)
        run: npm run upstream:fetch

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/rhwp -> target
            src-tauri -> target
          key: ${{ hashFiles('upstream.json') }}
          cache-on-failure: true

      - name: 문서 엔진 WASM 빌드 (업스트림 rust-toolchain.toml 사용)
        run: npm run build:wasm

      - name: 프런트엔드 빌드 (업스트림 스튜디오 의존성 설치 포함)
        run: npm run build:web

      - name: 타입 검사
        run: npm run typecheck

      - name: 오버레이 단위 테스트
        run: npm test

      - name: 앱 셸 단위 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 설치 파일 빌드 (NSIS + MSI)
        run: npx tauri build

      - name: 실행 확인 (문서를 연 채로 20초 동작 + 화면 캡처)
        shell: pwsh
        run: |
          $doc = Resolve-Path upstream/rhwp/saved/blank2010.hwp
          $p = Start-Process -FilePath src-tauri/target/release/rhwpp.exe -ArgumentList "`"$doc`"" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "rhwpp.exe 가 시작 직후 종료되었습니다 (exit $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD/smoke-screenshot.png")
          $title = (Get-Process -Id $p.Id).MainWindowTitle
          Write-Host "창 제목: $title"
          Stop-Process -Id $p.Id -Force
          if (-not $title.Contains('blank2010.hwp')) { throw "문서가 열리지 않았습니다 (창 제목: $title)" }

      - name: 스모크 테스트 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore

      - name: 휴대용 실행 파일 묶기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/rhwpp.exe portable/
          Compress-Archive -Path portable/* -DestinationPath rhwpp-portable-x64.zip -Force

      - name: 산출물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: rhwpp-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            rhwpp-portable-x64.zip
          if-no-files-found: error

  release:
    name: 릴리스 게시 (v* 태그)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rhwpp-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
