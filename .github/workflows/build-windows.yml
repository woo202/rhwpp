name: Windows 빌드

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 설치 파일
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (앱 셸)
        uses: dtolnay/rust-toolchain@stable

      - name: wasm-pack 0.15.0
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: npm 의존성
        run: npm ci

      - name: 업스트림 rhwp 받기 (upstream.json 고정 커밋, sparse checkout)
        run: npm run upstream:fetch

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/rhwp -> target
            src-tauri -> target
          key: ${{ hashFiles('upstream.json') }}

      - name: 문서 엔진 WASM 빌드 (업스트림 rust-toolchain.toml 사용)
        run: npm run build:wasm

      - name: 타입 검사
        run: npm run typecheck

      - name: 오버레이 단위 테스트
        run: npm test

      - name: 앱 셸 단위 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 설치 파일 빌드 (NSIS + MSI)
        run: npx tauri build

      - name: 휴대용 실행 파일 묶기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/rhwpp.exe portable/
          Compress-Archive -Path portable/* -DestinationPath rhwpp-portable-x64.zip -Force

      - name: 산출물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: rhwpp-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            rhwpp-portable-x64.zip
          if-no-files-found: error

  release:
    name: 릴리스 게시 (v* 태그)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rhwpp-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
